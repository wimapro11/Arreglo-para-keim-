$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'application'

tasks:
  dev:
    command: 'cargo run'
    options:
      runInCI: false

  check:
    command: 'cargo check'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  # Formatting only, so unlike `check` it never compiles GPUI.
  fmt:
    command: 'cargo fmt --all -- --check'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/rustfmt.toml'

  build:
    command: 'cargo build --release'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
    outputs:
      - '/target/release/opencut-desktop'
    options:
      runInCI: false  # a release build implies `check`, and costs ~30 min per OS
