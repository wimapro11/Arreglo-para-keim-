$schema: 'https://moonrepo.dev/schemas/project.json'

tasks:
  # The workspace root project owns the tooling that covers every app, so
  # these run from the repo root rather than from one project.
  lint:
    command: 'bun run lint'
    inputs:
      - 'apps/**/*'
      - 'biome.jsonc'
      - 'package.json'

  format:
    command: 'bun run format'
    options:
      runInCI: false  # `biome format --write`: local only, never in CI

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - 'scripts/**/*'
      - 'crates/media/setup/**/*'
      - 'tsconfig.json'
      - 'package.json'

  notices:
    command: 'bun run notices'
    inputs:
      - 'scripts/third-party-notices.ts'
      - 'crates/media/setup/ffmpeg.json'
    options:
      runInCI: false  # rewrites a committed file: run by hand, then commit

  upload-logos:
    script: |
      set -eu
      root="$(pwd)"

      if [ ! -f "$root/.env.local" ]; then
        echo 'Missing .env.local. Copy .env.example to .env.local first.' >&2
        exit 1
      fi

      set -a
      . "$root/.env.local"
      set +a
      : "${R2_BUCKET:?Set R2_BUCKET in .env.local}"

      for file in "$root"/brand/marks/*.svg; do
        bun run --cwd apps/web wrangler r2 object put \
          "$R2_BUCKET/${file##*/}" \
          --file "$file" \
          --content-type 'image/svg+xml' \
          --remote
      done
    inputs:
      - 'brand/marks/*.svg'
      - 'apps/web/package.json'
      - '.env.example'
    options:
      cache: false
      runInCI: false
